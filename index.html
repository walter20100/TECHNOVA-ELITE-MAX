<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technova Elite Max</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>

*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#0b0b15,#1a0030);
color:#fff;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 8%;
background:#000;
border-bottom:1px solid #8a2be2;
position:sticky;
top:0;
z-index:1000;
}
.logo{
font-size:22px;
font-weight:800;
color:#a855f7;
letter-spacing:2px;
}
.cart-btn{
background:#8a2be2;
border:none;
padding:10px 16px;
border-radius:6px;
cursor:pointer;
color:#fff;
font-weight:600;
}

/* HERO */
.hero{
padding:60px 8%;
text-align:center;
background:radial-gradient(circle,#1f0035,#000);
}
.hero h1{
font-size:34px;
color:#c084fc;
margin-bottom:10px;
}
.hero p{color:#bbb}

/* CATEGORY */
.category{
margin-top:40px;
padding:0 8%;
}
.category h2{
margin-bottom:20px;
color:#00ffcc;
}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(138,43,226,0.3);
border-radius:12px;
padding:15px;
transition:.3s;
}
.card:hover{
box-shadow:0 0 15px #8a2be2;
transform:translateY(-4px);
}
.main-img{
width:100%;
height:170px;
object-fit:cover;
border-radius:8px;
margin-bottom:6px;
cursor:pointer;
}
.thumbs{
display:flex;
gap:6px;
margin-bottom:8px;
}
.thumbs img{
width:49%;
height:60px;
object-fit:cover;
border-radius:6px;
cursor:pointer;
}

.price{color:#00ff88;margin:5px 0;font-weight:600;}
.old{text-decoration:line-through;color:#777;font-size:13px;}
.stars{color:#ffcc00;font-size:14px;margin-bottom:5px;}
.stock{font-size:12px;color:#ffcc00;margin-bottom:6px;}

.card button{
width:100%;
background:#8a2be2;
border:none;
padding:8px;
border-radius:6px;
color:#fff;
cursor:pointer;
font-weight:600;
}

/* CART */
.cart{
position:fixed;
right:-400px;
top:0;
width:360px;
height:100%;
background:#111;
padding:20px;
overflow-y:auto;
transition:.4s;
border-left:2px solid #8a2be2;
}
.cart.active{right:0;}
.cart-item{font-size:13px;margin-bottom:6px;}
.total{margin-top:10px;color:#00ff88;font-size:16px;}

input{
width:100%;
padding:6px;
margin-top:6px;
border-radius:4px;
border:none;
}

.checkout button{
margin-top:10px;
width:100%;
padding:8px;
border:none;
border-radius:6px;
background:#00aa88;
color:#fff;
cursor:pointer;
font-weight:600;
}

footer{
text-align:center;
padding:25px;
background:#000;
margin-top:60px;
border-top:1px solid #8a2be2;
}

</style>
</head>

<body>

<header>
<div class="logo">TECHNOVA ELITE MAX</div>
<button class="cart-btn" onclick="toggleCart()">🛒 Carrinho</button>
</header>

<section class="hero">
<h1>Hardware Gamer de Alta Performance</h1>
<p>Potência, desempenho e visual profissional.</p>
</section>

<div id="catalog"></div>

<div class="cart" id="cart">
<h3>Seu Carrinho</h3>
<div id="cart-items"></div>
<div class="total" id="total">Total: R$ 0,00</div>

<h4>Calcular Frete</h4>
<input type="text" id="cep" placeholder="Digite seu CEP">
<button onclick="calcularFrete()">Calcular Frete</button>
<div id="frete"></div>

<div class="checkout">
<button onclick="checkout()">Finalizar Compra</button>
</div>
</div>

<footer>
© 2026 Technova Elite Max. Todos os direitos reservados.
</footer>

<script>

/* ===== BASE DE IMAGENS ===== */

const imgSet = [
"https://images.unsplash.com/photo-1591488320449-011701bb6704?auto=format&fit=crop&w=800&q=80",
"https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=800&q=80",
"https://images.unsplash.com/photo-1587202372775-e229f172b9d7?auto=format&fit=crop&w=800&q=80",
"https://images.unsplash.com/photo-1518441902117-66f6b6b5d0b6?auto=format&fit=crop&w=800&q=80",
"https://images.unsplash.com/photo-1593642532400-2682810df593?auto=format&fit=crop&w=800&q=80",
"https://images.unsplash.com/photo-1587202372596-8c1a3c1fa9b3?auto=format&fit=crop&w=800&q=80"
];

/* ===== CATEGORIAS E PRODUTOS ===== */

const categories = {
"Headsets":[],
"Teclados":[],
"Mouses":[],
"Monitores":[],
"PC Gamer":[],
"Placas de Vídeo":[],
"Placas-mãe":[]
};

let id=1;

for(const cat in categories){
for(let i=1;i<=4;i++){
categories[cat].push({
id:id++,
nome:`${cat} Elite X${i}`,
preco: 200 + id*30,
antigo: 250 + id*35,
estoque: 5 + i,
rating: 4 + (i%2),
imgs:[ imgSet[(id+i)%imgSet.length], imgSet[(id+i+1)%imgSet.length] ]
});
}
}

let cart=[];

/* ===== RENDER ===== */

function renderCatalog(){
const catalog=document.getElementById("catalog");
catalog.innerHTML="";
for(const cat in categories){
catalog.innerHTML+=`<div class="category"><h2>${cat}</h2><div class="products" id="${cat}"></div></div>`;
categories[cat].forEach((prod,index)=>{
document.getElementById(cat).innerHTML+=`
<div class="card">
<img class="main-img" src="${prod.imgs[0]}" onclick="this.src='${prod.imgs[1]}'">
<div class="thumbs">
<img src="${prod.imgs[0]}" onclick="this.parentElement.previousElementSibling.src='${prod.imgs[0]}'">
<img src="${prod.imgs[1]}" onclick="this.parentElement.previousElementSibling.src='${prod.imgs[1]}'">
</div>
<h4>${prod.nome}</h4>
<div class="stars">${"⭐".repeat(prod.rating)}</div>
<div class="old">De R$ ${prod.antigo.toFixed(2)}</div>
<div class="price">R$ ${prod.preco.toFixed(2)}</div>
<div class="stock">Estoque disponível: ${prod.estoque}</div>
<button onclick="addToCart('${cat}',${index})">Adicionar ao Carrinho</button>
</div>`;
});
}
}

function addToCart(cat,index){
const prod=categories[cat][index];
if(prod.estoque>0){
cart.push(prod);
prod.estoque--;
renderCatalog();
renderCart();
}else{
alert("Produto esgotado.");
}
}

function renderCart(){
let items=document.getElementById("cart-items");
items.innerHTML="";
let total=0;
cart.forEach(item=>{
total+=item.preco;
items.innerHTML+=`<div class="cart-item">${item.nome} - R$ ${item.preco.toFixed(2)}</div>`;
});
document.getElementById("total").innerText="Total: R$ "+total.toFixed(2);
}

function toggleCart(){
document.getElementById("cart").classList.toggle("active");
}

function calcularFrete(){
let cep=document.getElementById("cep").value.replace(/\D/g,'');
if(cep.length<8){
document.getElementById("frete").innerText="Digite um CEP válido.";
return;
}
let valor=cep.startsWith("0")?18.90:29.90;
document.getElementById("frete").innerText="Frete estimado: R$ "+valor.toFixed(2);
}

function checkout(){
if(cart.length===0){
alert("Seu carrinho está vazio.");
return;
}
alert("Pedido confirmado com sucesso (modo demonstração).");
cart=[];
renderCatalog();
renderCart();
}

renderCatalog();

</script>

</body>
</html>
